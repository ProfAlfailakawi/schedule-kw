name: Comprehensive CI
# Revalidated after the instructor-request cross-college opening repair.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its older run. A run on main is never
# cancelled: deploy-schedule.yml releases only a commit whose full run on main
# passed, and a merge landing a minute later must not erase that verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify Project
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy target guard
        run: node tests/deploy-target-guard.mjs

      - name: Repository hygiene guard
        run: node tests/repo-hygiene-guard.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (noEmit)
        run: npm run lint

      # Pull requests skip the slowest tests (tests/slow.txt, ~45% of the test
      # time); every push to main runs them all, and deploy-schedule.yml only
      # releases a commit whose full run on main succeeded. Actions minutes are
      # billed, and each pull request used to pay for the full suite twice.
      - name: Run tests (quick for pull requests, all on main)
        run: npm test ${{ github.event_name == 'pull_request' && '-- --quick' || '' }}

      - name: Production Build
        run: npm run build

      - name: Verify intelligence scopes through the isolated demo API
        env:
          DATA_MODE: demo
          NODE_ENV: production
        run: |
          # خادمٌ تركه اختبارٌ سابق على المنفذ 3000 يُسقط خادمَ هذه الخطوة بـ EADDRINUSE فيقرأ الفحصُ خادماً قديماً ثم يفشل إيقافه.
          # نطبع ما وُجد ثم نغلقه؛ والأقواس في النمط تمنع مطابقة هذا الأمر نفسه.
          ps -eo pid,args | grep -E "[t]sx|[s]erver\.(ts|cjs)" || true
          pkill -9 -f "[t]sx server.ts" || true
          pkill -9 -f "[s]erver.ts" || true
          sleep 1
          node dist/server.cjs > /tmp/schedule-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run test:intelligence-api
