<!doctype html>
<!--
  صفحة «نُحدّث البرنامج».

  أثناء النشر يتبدّل الخادم، فتجيب واجهةُ Google الأماميّة عن التنقّل بصفحة خطأٍ
  إنجليزية لا يراها خادمُنا أصلاً. عاملُ الخدمة (public/sw.js، ومثله
  public/push-sw.js في بطاقة الأستاذ) يحفظ هذه الصفحة عند تثبيته، ويقدّمها بدلاً
  من أيّ جوابٍ 500/502/503/504 أو انقطاعٍ للتنقّل — والرابطُ في شريط العنوان يبقى
  ما طلبه الزائر، فإعادةُ التحميل تفتحه هو نفسه.

  مستقلّةٌ تماماً: لا طلبَ خارجياً، والخطُّ خطُّ البرنامج إن كان محفوظاً وإلا خطُّ
  النظام. تسأل /api/health كل ثلاث ثوانٍ (وتتباطأ تدريجياً)، فإذا أجاب أعادت فتح
  الصفحة المطلوبة. وإن عادت الصفحةُ تتعثّر والخادمُ سليم ثلاثَ مرّاتٍ في دقيقتين،
  تباطأت إلى مرّةٍ كل نصف دقيقة ولا تدور في حلقة.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080c0b" media="(prefers-color-scheme: dark)">
<title>نُحدّث البرنامج · SCHEDULE</title>
<style>
@font-face{font-family:"Plex Arabic";font-weight:400;font-display:swap;src:local("IBM Plex Sans Arabic"),url("/fonts/plex-arabic-arabic-400.woff2") format("woff2")}
@font-face{font-family:"Plex Arabic";font-weight:600;font-display:swap;src:local("IBM Plex Sans Arabic SemiBold"),url("/fonts/plex-arabic-arabic-600.woff2") format("woff2")}
:root{
  --bg:#f2f3ef;--ink:#131817;--muted:#4f5a56;--line:rgb(19 24 23 / .10);
  --accent:#1f6b5c;--glow:rgba(47,133,116,.13);--scan:#2f8574;--mint:#5fbfa6;--copper:#c79b5f;
  --button:#ffffff;--button-line:rgb(19 24 23 / .14);--shadow:rgba(12,24,20,.24);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#080c0b;--ink:#edf2ee;--muted:#a3b0aa;--line:rgb(255 255 255 / .09);
    --accent:#68b9a2;--glow:rgba(47,133,116,.22);--scan:#68b9a2;
    --button:#121816;--button-line:rgb(255 255 255 / .14);--shadow:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;min-height:100%;display:grid;place-items:center;
  padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
  background:radial-gradient(circle at 50% 40%,var(--glow),transparent 46%),var(--bg);
  color:var(--ink);
  font-family:"Plex Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
  font-synthesis:none;-webkit-font-smoothing:antialiased;text-align:center;
}
main{display:grid;justify-items:center;gap:0;max-width:420px;width:100%}
.stage{position:relative;width:132px;height:132px;display:grid;place-items:center;margin-bottom:30px}
.halo{position:absolute;inset:0;width:100%;height:100%;animation:turn 3.6s linear infinite}
.halo circle{fill:none;stroke-width:2;stroke-linecap:round}
.halo .track{stroke:var(--line)}
.halo .arc{stroke:var(--accent);stroke-dasharray:96 400;opacity:.85}
.mark{width:84px;height:84px;display:block;filter:drop-shadow(0 18px 30px var(--shadow))}
.mark .bar{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 2.4s cubic-bezier(.45,0,.25,1) infinite}
.mark .decided{animation:settle 2.4s cubic-bezier(.16,1,.3,1) infinite}
.spark{position:absolute;fill:var(--copper);animation:twinkle 2.4s ease-in-out infinite}
.spark.one{width:20px;height:20px;top:6px;inset-inline-start:8px}
.spark.two{width:12px;height:12px;bottom:14px;inset-inline-end:6px;fill:var(--mint);animation-delay:1.2s}
h1{margin:0;font-size:clamp(22px,5.6vw,27px);font-weight:600;line-height:1.5;letter-spacing:0}
.lead{margin:6px 0 0;font-size:16px;line-height:1.7;color:var(--muted)}
.pulse{width:132px;height:2px;margin:26px 0 28px;border-radius:99px;background:var(--line);overflow:hidden}
.pulse i{display:block;width:36%;height:100%;border-radius:inherit;background:linear-gradient(90deg,transparent,var(--scan),transparent);animation:scan 1.5s ease-in-out infinite}
button{
  min-height:44px;padding:0 22px;border-radius:12px;cursor:pointer;
  border:1px solid var(--button-line);background:var(--button);color:var(--ink);
  font:inherit;font-size:14px;font-weight:600;
  transition:border-color .2s ease,transform .2s ease;
}
button:hover{border-color:var(--accent)}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.note{min-height:20px;margin:14px 0 0;font-size:12.5px;line-height:1.6;color:var(--muted)}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.78)}}
@keyframes settle{0%{transform:translateY(-5px);opacity:.55}45%,100%{transform:none;opacity:1}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1) rotate(20deg)}}
@keyframes scan{0%{transform:translateX(130%)}100%{transform:translateX(-360%)}}
@media (prefers-reduced-motion:reduce){
  .halo,.mark .bar,.mark .decided,.spark,.pulse i{animation:none}
  .spark{opacity:.8}
}
</style>
</head>
<body>
<main>
  <div class="stage" aria-hidden="true">
    <svg class="halo" viewBox="0 0 132 132" focusable="false"><circle class="track" cx="66" cy="66" r="63"/><circle class="arc" cx="66" cy="66" r="63"/></svg>
    <svg class="mark" viewBox="0 0 64 64" focusable="false">
      <rect width="64" height="64" rx="14" fill="#141917"/>
      <rect x="1" y="1" width="62" height="62" rx="13.4" fill="none" stroke="#C79B5F" stroke-opacity=".22" stroke-width=".8"/>
      <rect class="bar" style="animation-delay:0s" x="46.4" y="19.5" width="5.6" height="15" rx="2.8" fill="#5FBFA6"/>
      <rect class="bar" style="animation-delay:.15s" x="37.8" y="27.5" width="5.6" height="12" rx="2.8" fill="#5FBFA6"/>
      <rect class="bar" style="animation-delay:.3s" x="29.2" y="16.5" width="5.6" height="19" rx="2.8" fill="#5FBFA6"/>
      <rect class="decided" x="20.6" y="32.5" width="5.6" height="14" rx="2.8" fill="#C79B5F"/>
      <rect class="bar" style="animation-delay:.45s" x="12" y="23.5" width="5.6" height="16" rx="2.8" fill="#5FBFA6"/>
    </svg>
    <svg class="spark one" viewBox="0 0 24 24" focusable="false"><path d="M12 0c.7 6.4 5.6 11.3 12 12-6.4.7-11.3 5.6-12 12-.7-6.4-5.6-11.3-12-12C6.4 11.3 11.3 6.4 12 0z"/></svg>
    <svg class="spark two" viewBox="0 0 24 24" focusable="false"><path d="M12 0c.7 6.4 5.6 11.3 12 12-6.4.7-11.3 5.6-12 12-.7-6.4-5.6-11.3-12-12C6.4 11.3 11.3 6.4 12 0z"/></svg>
  </div>
  <h1 id="title">نُحدّث البرنامج الآن ✨</h1>
  <p class="lead" id="lead">لحظاتٍ ونعود</p>
  <div class="pulse" aria-hidden="true"><i></i></div>
  <button type="button" id="retry">أعد المحاولة الآن</button>
  <p class="note" id="note" role="status" aria-live="polite">ستُفتح الصفحة التي طلبتها تلقائياً حين نعود.</p>
</main>
<script>
(function () {
  var HEALTH = "/api/health";
  var FIRST = 3000, CEILING = 15000, PATIENT = 30000;
  var KEY = "schedule-updating-reloads";
  var tries = 0, timer = 0, asking = false;
  var title = document.getElementById("title");
  var lead = document.getElementById("lead");
  var note = document.getElementById("note");

  /* إعاداتُ التحميل في الدقيقتين الأخيرتين: ثلاثٌ والخادمُ سليم تعني أن الصفحة
     نفسها تتعثّر، فلا ندور في حلقة. */
  function recent() {
    try {
      var now = Date.now();
      return JSON.parse(sessionStorage.getItem(KEY) || "[]").filter(function (t) { return now - t < 120000; });
    } catch (e) { return []; }
  }
  function remember() {
    try { var list = recent(); list.push(Date.now()); sessionStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
  }
  function stuck() { return recent().length >= 3; }

  /* فُتحت هذه الصفحة باسمها مباشرة: العودة إلى البداية، لا إليها. */
  function reopen() {
    remember();
    if (location.pathname === "/updating.html") location.replace("/");
    else location.reload();
  }

  function describe() {
    if (navigator.onLine === false) {
      title.textContent = "لا اتصال بالإنترنت الآن";
      lead.textContent = "سنعود تلقائياً حين يعود الاتصال";
      note.textContent = "";
    } else if (stuck()) {
      title.textContent = "نُحدّث البرنامج الآن ✨";
      lead.textContent = "يستغرق ذلك وقتاً أطول من المعتاد";
      note.textContent = "سنحاول مرّةً كل نصف دقيقة، ويمكنك المحاولة الآن.";
    } else {
      title.textContent = "نُحدّث البرنامج الآن ✨";
      lead.textContent = "لحظاتٍ ونعود";
      note.textContent = "ستُفتح الصفحة التي طلبتها تلقائياً حين نعود.";
    }
  }

  function wait() {
    if (stuck()) return PATIENT;
    return Math.min(CEILING, Math.round(FIRST * Math.pow(1.3, Math.max(0, tries - 5))));
  }
  function later() { clearTimeout(timer); timer = setTimeout(ask, wait()); }

  function ask() {
    clearTimeout(timer);
    if (asking) return;
    if (navigator.onLine === false) { describe(); later(); return; }
    asking = true;
    tries++;
    var control = typeof AbortController === "function" ? new AbortController() : null;
    var guard = setTimeout(function () { if (control) control.abort(); }, 8000);
    fetch(HEALTH, { cache: "no-store", credentials: "same-origin", signal: control ? control.signal : undefined })
      .then(function (response) { return response.ok; }, function () { return false; })
      .then(function (ok) {
        clearTimeout(guard);
        asking = false;
        if (ok) { reopen(); return; }
        describe();
        later();
      });
  }

  document.getElementById("retry").addEventListener("click", function () {
    if (location.pathname === "/updating.html") location.replace("/");
    else location.reload();
  });
  window.addEventListener("online", function () { describe(); ask(); });
  window.addEventListener("offline", describe);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) ask(); });

  describe();
  later();
})();
</script>
</body>
</html>
